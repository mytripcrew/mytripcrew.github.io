<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TripCrew — 함께 짜는 여행 지도 · 일정 · 정산</title>
  <meta property="og:title" content="TripCrew — 함께 짜는 여행 지도 · 일정 · 정산" />
  <meta property="og:description" content="친구·가족과 실시간으로 여행 일정을 계획하고, N빵 정산과 나만의 맛집 지도를 한 곳에서 관리하세요." />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #111827;
      --sub: #6b7280;
      --accent: #007aff;
      --border: rgba(0, 0, 0, 0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --card: #1c1e24;
        --text: #f3f4f6;
        --sub: #9ca3af;
        --accent: #0a84ff;
        --border: rgba(255, 255, 255, 0.1);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, #ff7b4c, #ea4a25);
      color: #fff;
      font-size: 30px;
      margin-bottom: 18px;
    }
    h1 { margin: 0 0 10px; font-size: 24px; font-weight: 800; letter-spacing: -0.4px; }
    p { margin: 0 0 24px; font-size: 14.5px; line-height: 1.6; color: var(--sub); }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
      font-size: 15.5px;
      font-weight: 700;
      text-decoration: none;
    }
    .support {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      font-size: 13px;
      color: var(--sub);
    }
    .support a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge" aria-hidden="true">🗺️</div>
    <h1>TripCrew</h1>
    <p>함께 짜는 여행 지도 · 일정 · N빵 정산 · 나만의 장소 아카이브.<br />Group Travel Map, Itinerary &amp; Expense Split for iOS.</p>
    <a class="btn" href="tripcrew://open">TripCrew 앱 열기</a>
    <div class="support">
      Support &amp; Inquiries: <a href="mailto:chl8523@gmail.com">chl8523@gmail.com</a>
    </div>
  </main>
</body>
</html>
